<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">

<html>
<head>
<title>Sample 12 month calendar</title>
<style type="text/css">
	body {
		background: #80c1ff;
	}
	table {
		border: none;
		margin-left: auto;
		margin-right: auto;
		background: transparent;
		border-collapse: collapse;
	}
    td {
        padding: 5px;
		vertical-align: text-top;    
    }
	table.cal {
		width: 14em;
		border: thin solid black;
		border-collapse: collapse;
		empty-cells: show;
		vertical-align: text-top;
		font-size: 12px;
        margin-top: 0px;
        margin-bottom: auto;
	}
	td.calcell {
		width: 2em;
		height: 2em;
		border: thin solid black;
		border-collapse: collapse;
		text-align: center;
		vertical-align: middle;
	}
	td.today {
		width: 2em;
		height: 2em;
		border: thin solid black;
		border-collapse: collapse;
		text-align: center;
		background-color: silver;
		color: red;
		vertical-align: middle;
	}
	th.cal {
		width: 14em;
		text-align: center;
		height: 2em;
		border: thin solid black;
		border-collapse: collapse;
		font-size: 14px;
	}
</style>
  
</head>

<body>
<div align="center">
