// -- System Time Start --

var currenttime = "{V_SERVERTIME}";
var montharray = new Array("{January}", "{February}", "{March}", "{April}", "{May}", "{June}", "{July}", "{August}", "{September}", "{October}", "{November}", "{December}");
var serverdate = new Date(currenttime);

function padlength(what)
{
	var output = (what.toString().length==1)? "0" + what : what;
	return output;
}

function displaytime(){
	serverdate.setSeconds( serverdate.getSeconds() + 1 );
	
	var datestring = serverdate.getFullYear() + " " +
	                 montharray[serverdate.getMonth()] + " " +
					 padlength(serverdate.getDate());
	
	var timestring = padlength(serverdate.getHours()) + ":" +
	                 padlength(serverdate.getMinutes()) + ":" +
					 padlength(serverdate.getSeconds());
	
	document.getElementById("servertime").innerHTML = datestring + " " + timestring;
}

window.onload = function()
{
	setInterval("displaytime()", 1000)
}

// -- System Time End --
