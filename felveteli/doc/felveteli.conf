<VirtualHost *:80>
	ServerName felveteli.wloc
	DocumentRoot "c:/Apps/Tasks/prjs/wamp/felveteli/www"
	<Directory  "c:/Apps/Tasks/prjs/wamp/felveteli/www/">
		Options +Indexes +Includes +FollowSymLinks +MultiViews
		AllowOverride All
		Require local
	</Directory>
        ErrorLog "c:/Apps/Tasks/prjs/logs/felveteli.wloc-error.log"
        CustomLog "c:/Apps/Tasks/prjs/logs/felveteli.wloc-access.log" combined
</VirtualHost>
